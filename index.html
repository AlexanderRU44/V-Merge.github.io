<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Merge</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AlexanderRU44/TV.github.io/refs/heads/Icons/ICONS/android-chrome-192x192.png">

    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            overflow: hidden;
        }

        h2 { color: #f0f6fc; font-weight: 400; margin: 0 0 15px 0; text-align: center; flex-shrink: 0; }

        .toolbar {
            display: flex; gap: 10px; align-items: center; justify-content: center;
            margin-bottom: 15px; flex-shrink: 0; flex-wrap: wrap;
        }
        .toolbar label { font-size: 13px; color: #8b949e; }
        .toolbar select, .toolbar input {
            padding: 8px 10px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #c9d1d9; font-size: 13px; min-width: 160px;
        }
        .toolbar button {
            padding: 8px 14px; cursor: pointer; border-radius: 6px;
            font-weight: 600; font-size: 12px; border: none;
        }
        .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-refresh { background: #238636; color: white; }
        .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-download { background: #1f6feb; color: white; }

        .container { display: flex; gap: 15px; flex-grow: 1; min-height: 0; }

        .column {
            flex: 1; display: flex; flex-direction: column;
            background: #161b22; padding: 15px; border-radius: 10px;
            border: 1px solid #30363d; min-width: 0;
        }
        .col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .col-header h3 { margin: 0; font-size: 16px; }

        #resultDisplay, .table-wrapper {
            flex-grow: 1; width: 100%; padding: 10px; border: 1px solid #30363d;
            border-radius: 6px; font-family: monospace; font-size: 13px;
            background-color: #0d1117; color: #d1d5da; box-sizing: border-box;
            overflow-y: auto; word-break: break-all;
        }
        #resultDisplay { counter-reset: line; white-space: pre-wrap; }
        .line-item { display: block; min-height: 1.2em; position: relative; padding-left: 55px; line-height: 1.5; }
        .line-item::before {
            counter-increment: line; content: counter(line);
            position: absolute; left: 0; width: 45px; text-align: right;
            color: #484f58; border-right: 1px solid #30363d; padding-right: 8px;
        }
        .line-highlight { background-color: rgba(247, 129, 102, 0.3); border-radius: 2px; }

        .table-wrapper { padding: 0; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th {
            position: sticky; top: 0; background-color: #0d1117;
            color: #8b949e; z-index: 10; text-align: left;
            padding: 12px 8px; border-bottom: 2px solid #30363d; font-size: 12px;
            cursor: pointer; user-select: none;
        }
        th:hover { color: #c9d1d9; }
        th .arrow { font-size: 10px; opacity: 0.6; margin-left: 4px; }
        td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #21262d; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        tbody tr { cursor: pointer; transition: background 0.2s; }
        tbody tr:hover { background-color: #1f2937; }

        .Label { padding: 2px 6px; font-size: 10px; font-weight: 600; border-radius: 10px; text-transform: uppercase; border: 1px solid #444c56; }
        .type-vless { color: #58a6ff; border-color: #58a6ff; background: rgba(88,166,255,0.1); }
        .type-vmess { color: #a371f7; border-color: #a371f7; background: rgba(163,113,247,0.1); }
        .type-trojan { color: #ff7b72; border-color: #ff7b72; background: rgba(255,123,114,0.1); }
        .type-ss { color: #d29922; border-color: #d29922; background: rgba(210,153,34,0.1); }
        .type-hysteria2 { color: #f778ba; border-color: #f778ba; background: rgba(247,120,186,0.1); }

        .country-cell { display: flex; align-items: center; gap: 6px; }
        .country-flag { font-size: 16px; line-height: 1; }
        .country-code { color: #8b949e; font-size: 11px; }

        #status { margin-top: 8px; font-size: 0.8em; font-family: monospace; color: #8b949e; }

        @media (max-width: 1000px) {
            body { overflow-y: auto !important; height: auto; }
            .container { flex-direction: column; height: auto; }
            .column { height: 500px; flex: none; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <h2>V-Merge</h2>

    <div class="toolbar">
        <label for="countryFilter">Страна:</label>
        <select id="countryFilter" onchange="applyFilters()">
            <option value="">Все</option>
        </select>

        <label for="typeFilter">Тип:</label>
        <select id="typeFilter" onchange="applyFilters()">
            <option value="">Все</option>
        </select>

        <input type="text" id="searchInput" placeholder="Поиск по адресу…" oninput="applyFilters()">

        <button class="btn-refresh" id="btnRefresh" onclick="loadConfigs()">🔄 Обновить</button>
        <button class="btn-copy" id="btnCopy" onclick="copyToClipboard()" disabled>Копировать</button>
        <button class="btn-download" id="btnDownload" onclick="downloadTxt()" disabled>Скачать TXT</button>
    </div>

    <div class="container">
        <div class="column">
            <div class="col-header">
                <h3>Конфиги</h3>
                <span id="countBadge" style="font-size:12px;color:#8b949e;"></span>
            </div>
            <div id="resultDisplay"></div>
            <div id="status">> <span id="statusText">Загрузка…</span></div>
        </div>

        <div class="column">
            <div class="col-header">
                <h3>Параметры</h3>
            </div>
            <div class="table-wrapper">
                <table id="configTable">
                    <thead>
                        <tr>
                            <th data-key="num"     style="width:45px">#<span class="arrow" data-arrow="num"></span></th>
                            <th data-key="type"    style="width:85px">Тип<span class="arrow" data-arrow="type"></span></th>
                            <th data-key="address">Адрес<span class="arrow" data-arrow="address"></span></th>
                            <th data-key="port"    style="width:70px">Порт<span class="arrow" data-arrow="port"></span></th>
                            <th data-key="country" style="width:90px">Страна<span class="arrow" data-arrow="country"></span></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==== ПУТИ ====
        const MERGED_URL = "output/merged.txt";
        const GEO_URL    = "https://raw.githubusercontent.com/AlexanderRU44/V-Merge.github.io/refs/heads/main/scripts/geo_cache.json";
        // ==============

        let allRows = [];
        let visibleRows = [];
        let sortKey = null;
        let sortDir = 1;
        let geoCache = {};

        // --- Хелперы ---
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function countryToFlag(cc) {
            if (!cc || cc.length !== 2 || cc === "XX") return "🏴";
            const A = 0x1F1E6;
            return String.fromCodePoint(
                A + (cc.charCodeAt(0) - 65),
                A + (cc.charCodeAt(1) - 65)
            );
        }

        // --- Загрузка geo_cache.json ---
        async function loadGeoCache() {
            try {
                const res = await fetch(GEO_URL + "?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                const normalized = {};
                for (const [k, v] of Object.entries(data)) {
                    normalized[String(k).trim().toLowerCase()] = String(v).trim().toUpperCase();
                }
                geoCache = normalized;
                console.log("[V-Merge] geo_cache загружен, записей:", Object.keys(geoCache).length);
            } catch (e) {
                console.warn("[V-Merge] не удалось загрузить geo_cache.json:", e.message);
                geoCache = {};
            }
        }

        function lookupCountry(host) {
            if (!host || host === "-") return "XX";
            return geoCache[String(host).trim().toLowerCase()] || "XX";
        }

        // --- Извлечение хоста из vmess:// ---
        function hostFromVmess(link) {
            try {
                let b64 = link.slice("vmess://".length);
                b64 += "=".repeat((4 - (b64.length % 4)) % 4);
                const json = atob(b64);
                const data = JSON.parse(json);
                return data.add || data.host || "";
            } catch (e) {
                return "";
            }
        }

        // --- Парсинг merged.txt (авто-определение формата) ---
        function parseMerged(text) {
            const rows = [];
            const lines = text.split(/\r?\n/);
            for (const raw of lines) {
                const line = raw.replace(/\s+$/, "");
                if (!line || line.startsWith("#")) continue;

                // Формат 1: TSV
                if (line.includes("\t")) {
                    const parts = line.split("\t").map(s => s.trim());
                    if (parts.length >= 4) {
                        rows.push({
                            num: parseInt(parts[0], 10) || rows.length + 1,
                            type: parts[1].toLowerCase(),
                            address: parts[2],
                            port: parts[3]
                        });
                        continue;
                    }
                }

                // Формат 2: обычная ссылка
                if (line.includes("://")) {
                    const type = line.split("://", 1)[0].toLowerCase();
                    let address = "", port = "";
                    if (type === "vmess") {
                        address = hostFromVmess(line);
                        try {
                            let b64 = line.slice("vmess://".length);
                            b64 += "=".repeat((4 - (b64.length % 4)) % 4);
                            const data = JSON.parse(atob(b64));
                            port = String(data.port || "");
                        } catch (e) {}
                    } else {
                        try {
                            const u = new URL(line);
                            address = u.hostname || "";
                            port = u.port || "";
                        } catch (e) {
                            const rest = line.slice(line.indexOf("://") + 3);
                            const afterAt = rest.split("@").pop();
                            const hostPort = afterAt.split(/[/?#]/)[0];
                            const [h, p] = hostPort.split(":");
                            address = h || "";
                            port = p || "";
                        }
                    }
                    rows.push({
                        num: rows.length + 1,
                        type,
                        address,
                        port
                    });
                }
            }
            return rows;
        }

        // --- Отрисовка ---
        function renderList(rows) {
            const display = document.getElementById('resultDisplay');
            if (!rows.length) {
                display.innerHTML = '<div style="color:#484f58;padding:20px;text-align:center;">Нет данных</div>';
                return;
            }
            display.innerHTML = rows.map(r => {
                const flag = countryToFlag(r.country);
                const text = `${r.type}://${r.address}:${r.port}`;
                return `<span class="line-item" data-num="${r.num}">${escapeHtml(text)} <span style="color:#8b949e;">${flag} ${r.country}</span></span>`;
            }).join('');
        }

        function renderTable(rows) {
            const tbody = document.querySelector('#configTable tbody');
            tbody.innerHTML = '';
            rows.forEach((r, i) => {
                const flag = countryToFlag(r.country);
                tbody.insertAdjacentHTML('beforeend', `<tr onclick="scrollToLine(${i})" data-index="${i}">
                    <td>${r.num}</td>
                    <td><span class="Label type-${r.type}">${r.type}</span></td>
                    <td title="${escapeHtml(r.address)}">${escapeHtml(r.address)}</td>
                    <td>${r.port}</td>
                    <td><div class="country-cell"><span class="country-flag">${flag}</span><span class="country-code">${r.country}</span></div></td>
                </tr>`);
            });
        }

        function scrollToLine(index) {
            const items = document.querySelectorAll('#resultDisplay .line-item');
            items.forEach(item => item.classList.remove('line-highlight'));
            if (items[index]) {
                items[index].classList.add('line-highlight');
                items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // --- Фильтры/сортировка ---
        function buildFilterOptions() {
            const countrySel = document.getElementById('countryFilter');
            const typeSel = document.getElementById('typeFilter');

            const countries = [...new Set(allRows.map(r => r.country))].sort();
            const types = [...new Set(allRows.map(r => r.type))].sort();

            countrySel.innerHTML = '<option value="">Все</option>' +
                countries.map(c => `<option value="${c}">${countryToFlag(c)} ${c}</option>`).join('');
            typeSel.innerHTML = '<option value="">Все</option>' +
                types.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function applyFilters() {
            const cf = document.getElementById('countryFilter').value;
            const tf = document.getElementById('typeFilter').value;
            const q = document.getElementById('searchInput').value.trim().toLowerCase();

            visibleRows = allRows.filter(r =>
                (!cf || r.country === cf) &&
                (!tf || r.type === tf) &&
                (!q || r.address.toLowerCase().includes(q))
            );

            applySort();
            renderList(visibleRows);
            renderTable(visibleRows);
            updateButtons();
            document.getElementById('countBadge').innerText = visibleRows.length + " / " + allRows.length;
        }

        function applySort() {
            if (!sortKey) return;
            visibleRows.sort((a, b) => {
                let va = a[sortKey], vb = b[sortKey];
                if (sortKey === "num" || sortKey === "port") {
                    va = parseInt(va, 10) || 0;
                    vb = parseInt(vb, 10) || 0;
                    return (va - vb) * sortDir;
                }
                va = String(va).toLowerCase();
                vb = String(vb).toLowerCase();
                return va.localeCompare(vb) * sortDir;
            });
        }

        document.querySelectorAll('#configTable thead th').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.key;
                if (!key) return;
                if (sortKey === key) sortDir = -sortDir;
                else { sortKey = key; sortDir = 1; }
                document.querySelectorAll('#configTable thead .arrow').forEach(a => a.textContent = '');
                const arrow = th.querySelector('.arrow');
                if (arrow) arrow.textContent = sortDir === 1 ? '▲' : '▼';
                applyFilters();
            });
        });

        // --- Загрузка ---
        async function loadConfigs() {
            const btn = document.getElementById('btnRefresh');
            const status = document.getElementById('statusText');

            btn.disabled = true;
            status.innerText = "Загрузка…";

            try {
                const geoPromise = Object.keys(geoCache).length
                    ? Promise.resolve()
                    : loadGeoCache();

                const [_, mergedRes] = await Promise.all([
                    geoPromise,
                    fetch(MERGED_URL + "?t=" + Date.now(), { cache: "no-store" })
                ]);

                if (!mergedRes.ok) throw new Error("merged.txt: HTTP " + mergedRes.status);
                const text = await mergedRes.text();

                const parsed = parseMerged(text);
                for (const r of parsed) {
                    r.country = lookupCountry(r.address);
                }
                allRows = parsed;

                buildFilterOptions();
                applyFilters();

                const known = allRows.filter(r => r.country !== "XX").length;
                status.innerText = `Загружено: ${allRows.length} (со страной: ${known}, XX: ${allRows.length - known})`;
            } catch (e) {
                console.error("[V-Merge]", e);
                allRows = [];
                visibleRows = [];
                renderList([]);
                renderTable([]);
                updateButtons();
                document.getElementById('countBadge').innerText = "";
                status.innerText = "Ошибка: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        function updateButtons() {
            const has = visibleRows.length > 0;
            document.getElementById('btnCopy').disabled = !has;
            document.getElementById('btnDownload').disabled = !has;
        }

        function copyToClipboard() {
            const btn = document.getElementById('btnCopy');
            const text = visibleRows
                .map(r => `${r.type}://${r.address}:${r.port}`)
                .join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerText;
                btn.innerText = "Скопировано!";
                setTimeout(() => btn.innerText = orig, 2000);
            });
        }

        function downloadTxt() {
            if (!visibleRows.length) return;
            const text = visibleRows
                .map(r => `${r.type}://${r.address}:${r.port}`)
                .join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'configs.txt';
            a.click();
        }

        loadConfigs();
    </script>
</body>
</html>
