name: Check Configs Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check script
        run: python scripts/check_configs.py

      - name: Commit working configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/working_configs.txt
          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "auto: update working configs [skip ci]"
            git push
          fi