name: Update merged configs

on:
  schedule:
    - cron: "*/15 * * * *"      # каждые 15 минут
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-merged
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run merge script
        run: python scripts/merge.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ВАЖНО: не забываем про sources_state.json и geo_cache.json
          git add output/merged.txt \
                  output/merged.base64.txt \
                  scripts/geo_cache.json \
                  scripts/sources_state.json

          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "auto: update configs + geo cache + state [skip ci]"
            git push
          fi
